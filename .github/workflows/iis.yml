name: Deploy Star Words API to IIS

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: verify .NET
        shell: powershell
        run: |
          dotnet --info
          dotnet --version


      - name: Restore dependencies
        run: dotnet restore backend/StarWords.Api/StarWords.Api.csproj

      - name: Build application
        run: dotnet build backend/StarWords.Api/StarWords.Api.csproj --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish backend/StarWords.Api/StarWords.Api.csproj --configuration Release --no-build --output "${{ runner.temp }}\starwords-publish"

      - name: Deploy to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          Stop-WebAppPool -Name "StarWordsApi"

          $source = "${{ runner.temp }}\starwords-publish"
          $destination = "E:\starwords\publish\starwords.api"

          Write-Host "Stopping IIS application pool: $appPool"
          Stop-WebAppPool -Name $appPool

          try {
              Write-Host "Copying files from:"
              Write-Host $source
              Write-Host "Copying files to:"
              Write-Host $destination

              robocopy $source $destination /MIR
              $robocopyExitCode = $LASTEXITCODE

              if ($robocopyExitCode -ge 8) {
                  throw "File deployment failed with Robocopy exit code $robocopyExitCode"
              }

              Write-Host "Robocopy succeeded with exit code $robocopyExitCode"

              # Robocopy codes 0–7 are successful.
              # Reset the exit code so GitHub Actions does not mark the step failed.
              $global:LASTEXITCODE = 0
          }
          finally {
              Write-Host "Starting IIS application pool: $appPool"
              Start-WebAppPool -Name $appPool
          }

          Write-Host "IIS deployment completed successfully."
      - name: Wait for API
        shell: powershell
        run: Start-Sleep -Seconds 5

      - name: Run smoke test
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://localhost:5270/" `
            -UseBasicParsing

          if ($response.StatusCode -ne 200) {
              throw "Smoke test failed. Status: $($response.StatusCode)"
          }

          if ($response.Content -notmatch "Star Words API is running") {
              throw "Smoke test failed: expected API message was not found."
          }

          Write-Host "Smoke test passed."
          Write-Host $response.Content

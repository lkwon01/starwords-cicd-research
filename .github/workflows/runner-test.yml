name: Test Windows VM Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows-runner:
    name: Verify Windows VM and IIS
    runs-on: [self-hosted, Windows, X64, starwords-vm]

    steps:
      - name: Check out research repository
        uses: actions/checkout@v7

      - name: Display runner information
        shell: powershell
        run: |
          Write-Host "GitHub Actions runner connected successfully."
          Write-Host "Computer name: $env:COMPUTERNAME"
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Commit: $env:GITHUB_SHA"

          Write-Host ""
          Write-Host "Windows account running the workflow:"
          whoami

          Write-Host ""
          Write-Host "PowerShell version:"
          $PSVersionTable.PSVersion

      - name: Verify IIS
        shell: powershell
        run: |
          $iisService = Get-Service -Name W3SVC -ErrorAction Stop

          Write-Host "IIS service status: $($iisService.Status)"

          if ($iisService.Status -ne "Running") {
              throw "IIS World Wide Web Publishing Service is not running."
          }

          Import-Module WebAdministration

          Write-Host ""
          Write-Host "Configured IIS websites:"
          Get-Website |
            Select-Object Name, State, PhysicalPath |
            Format-Table -AutoSize

      - name: Verify StarWords deployment folder
        shell: powershell
        run: |
          $deploymentPath = "E:\StarWords\frontend"

          Write-Host "Checking deployment path: $deploymentPath"

          if (-not (Test-Path $deploymentPath)) {
              throw "Deployment folder does not exist: $deploymentPath"
          }

          Write-Host "Deployment folder exists."

          $indexFile = Join-Path $deploymentPath "index.html"

          if (Test-Path $indexFile) {
              Write-Host "index.html was found."
          }
          else {
              Write-Warning "The folder exists, but index.html was not found."
          }

      - name: Test local website
        shell: powershell
        run: |
          $healthUrl = "http://localhost"

          Write-Host "Testing $healthUrl"

          $response = Invoke-WebRequest `
            -Uri $healthUrl `
            -UseBasicParsing `
            -TimeoutSec 15

          Write-Host "HTTP status code: $($response.StatusCode)"

          if ($response.StatusCode -ne 200) {
              throw "Website health check failed."
          }

          Write-Host "Windows VM runner test completed successfully."

stages:
  - build
  - deploy

build:
  stage: build
  script:
    - echo "Build OK"

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  image: amazon/aws-cli:2.17.16
  variables:
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
    PUBLIC_DIR: .         # change if your site files live elsewhere
  script:
    # --- Debug / sanity checks ---
    - aws --version
    - echo "Branch: $CI_COMMIT_BRANCH"
    - |
      if [ -z "$S3_BUCKET" ]; then
        echo "ERROR: S3_BUCKET is empty"; exit 1;
      fi
      if [ -z "$AWS_DEFAULT_REGION" ]; then
        echo "ERROR: AWS_DEFAULT_REGION is empty"; exit 1;
      fi
      if ! aws sts get-caller-identity >/dev/null 2>&1; then
        echo "ERROR: AWS creds not working"; exit 1;
      fi
      if ! aws s3 ls "s3://$S3_BUCKET" >/dev/null 2>&1; then
        echo "ERROR: Cannot access bucket: $S3_BUCKET"; exit 1;
      fi

    # --- 1) Sync non-HTML with long cache (fast + immutable) ---
    - aws s3 sync "$PUBLIC_DIR" "s3://$S3_BUCKET" \
        --delete \
        --exclude ".git/*" \
        --exclude ".gitlab-ci.yml" \
        --exclude "*.html" \
        --metadata-directive REPLACE \
        --cache-control "public,max-age=31536000,immutable"

    # --- 2) Upload ALL HTML with no-cache headers (always fresh) ---
    - aws s3 cp "$PUBLIC_DIR" "s3://$S3_BUCKET" \
        --recursive \
        --exclude "*" --include "*.html" \
        --metadata-directive REPLACE \
        --cache-control "no-cache, no-store, must-revalidate" \
        --content-type "text/html"

    # --- 3) CloudFront: invalidate HTML only (cheap + quick) ---
    - |
      if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
        aws cloudfront create-invalidation \
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
          --paths "/index.html" "/*.html" "/*/*.html" "/*/*/*.html" "/*/*/*/*.html"
      else
        echo "CLOUDFRONT_DISTRIBUTION_ID not set; skipping invalidation."
      fi

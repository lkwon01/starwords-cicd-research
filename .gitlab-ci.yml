stages:
  - build
  - deploy

build:
  image: alpine:3.20
  stage: build
  script:
    - echo "Static site: no build step"
  artifacts:
    paths:
      - .
  rules:
    - if: $CI_COMMIT_BRANCH

deploy_production:
  image: amazon/aws-cli:2.17.16
  stage: deploy
  needs: [build]
  environment:
    name: production
    url: https://starwords.space
  script:
    - aws --version
    - aws sts get-caller-identity
    - aws s3 sync "$CI_PROJECT_DIR/$PUBLIC_DIR" "s3://$S3_BUCKET" --delete --exclude "index.html" --metadata-directive REPLACE --cache-control "public,max-age=31536000,immutable"
    - aws s3 cp "$CI_PROJECT_DIR/$PUBLIC_DIR/index.html" "s3://$S3_BUCKET/index.html" --metadata-directive REPLACE --cache-control "no-cache, no-store, must-revalidate"
    - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

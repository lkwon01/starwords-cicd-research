stages:
  - build
  - deploy

build:
  stage: build
  script:
    - echo "Build OK"

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  image: amazon/aws-cli
  variables:
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
  script:

    # Debug – make sure vars exist (won't print secrets)
    - aws --version
    - echo "Branch: $CI_COMMIT_BRANCH"
    - test -n "$S3_BUCKET" || (echo "ERROR: S3_BUCKET is empty" && exit 1)
    - test -n "$AWS_DEFAULT_REGION" || (echo "ERROR: AWS_DEFAULT_REGION is empty" && exit 1)
    - aws sts get-caller-identity || (echo "ERROR: AWS creds not working" && exit 1)
    - aws s3 ls "s3://$S3_BUCKET" || (echo "ERROR: Cannot access bucket: $S3_BUCKET" && exit 1)

    - aws s3 sync . s3://$S3_BUCKET --delete --exclude ".git/*" --exclude ".gitlab-ci.yml"
    - |
      if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
        aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
      fi

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Create a Star Words Account</title>

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: black;
      color: #feda4a;
      font-family: Arial, sans-serif;
    }

    .registration-panel {
      width: min(420px, 86%);
      padding: 28px;
      border: 1px solid #feda4a;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 20px rgba(254, 218, 74, 0.25);
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border: 1px solid #feda4a;
      border-radius: 5px;
      font-size: 1rem;
    }

    button,
    a {
      display: inline-block;
      margin: 18px 6px 4px;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      background: #feda4a;
      color: black;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    a:hover {
      background: #ffe870;
    }

    #registration-message {
      min-height: 24px;
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <main class="registration-panel">
    <h1>Create Your Rebel Account</h1>

    <p>
      Register for Star Words Korean training.
    </p>

    <form id="registration-form">
      <label for="username">Username</label>

      <input
        id="username"
        name="username"
        type="text"
        minlength="3"
        maxlength="100"
        autocomplete="username"
        required
      />

      <label for="email">Email</label>

      <input
        id="email"
        name="email"
        type="email"
        maxlength="255"
        autocomplete="email"
        required
      />
      <label for="password">Password</label>

      <input
        id="password"
        name="password"
        type="password"
        minlength="8"
        maxlength="100"
        autocomplete="new-password"
        required
      />

      <label for="confirm-password">Confirm Password</label>

      <input
        id="confirm-password"
        name="confirm-password"
        type="password"
        minlength="8"
        maxlength="100"
        autocomplete="new-password"
        required
      />
      <br />

      <button type="submit">
        Create Account
      </button>
    </form>

    <p id="registration-message"></p>

    <a href="index.html">
      Return to Login
    </a>
  </main>

  <script>
    const API_BASE_URL = "http://localhost:5270";

    const registrationForm =
      document.getElementById("registration-form");

    const registrationMessage =
      document.getElementById("registration-message");

    registrationForm.addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const username =
          document.getElementById("username").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const confirmPassword =
          document.getElementById("confirm-password").value;

        if (password !== confirmPassword) {
          registrationMessage.textContent =
            "The passwords do not match.";

          return;
        }
        registrationMessage.textContent =
          "Creating your rebel account...";

        try {
          const response = await fetch(
            `${API_BASE_URL}/api/auth/register`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                username,
                email,
                password
              })
            }
          );

          const data = await response.json();

          if (!response.ok || !data.success) {
            registrationMessage.textContent =
              data.message ||
              data.detail ||
              "Registration failed.";

            return;
          }

          localStorage.setItem(
            "studentId",
            data.studentId
          );

          localStorage.setItem(
            "username",
            data.username
          );

          registrationMessage.textContent =
            `Welcome, ${data.username}. Your account is ready.`;

          setTimeout(() => {
            window.location.href =
              "mission/mission-1/index.html";
          }, 1200);
        }
        catch (error) {
          registrationMessage.textContent =
            "Could not connect to the rebel base API.";

          console.error(error);
        }
      }
    );
  </script>
</body>
</html>

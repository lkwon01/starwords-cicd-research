<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Joining… — Star Words</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{margin:0;background:#000;color:#feda4a;font-family:Arial,Helvetica,sans-serif}
    main{max-width:760px;margin:40px auto;padding:24px}
    a{color:#feda4a}
    .card{background:#111;border:1px solid #333;border-radius:12px;padding:20px}
  </style>
</head>
<body>
  <main>
    <h1>Welcome to the Rebellion</h1>
    <div class="card">
      <p id="status">Verifying your magic link…</p>
    </div>
    <p style="margin-top:24px"><a href="../index.html">← Back to Home</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // TODO: fill in your Supabase project values
    const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
    const SUPABASE_ANON_KEY = "ey...YOUR-ANON-KEY...";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById('status');

    (async () => {
      try {
        // supabase-js v2 will parse the hash from the magic link automatically
        const { data: { session }, error: sessErr } = await client.auth.getSession();
        if (sessErr) throw sessErr;

        // If no session yet, try to fetch the user (gives time for token exchange)
        if (!session) {
          const { data: { user }, error } = await client.auth.getUser();
          if (error || !user) {
            statusEl.textContent = "We couldn’t verify your link. Please reopen it from your email.";
            return;
          }
        }

        // We’re authenticated now—get the user
        const { data: { user } } = await client.auth.getUser();
        if (!user) {
          statusEl.textContent = "Authentication failed. Please try the link again.";
          return;
        }

        // OPTIONAL: If you did NOT add the DB trigger, ensure a profile row exists
        // (Your RLS requires auth.uid() = id, which is true now.)
        try {
          await client.from("profiles")
            .upsert({ id: user.id, email: user.email }, { onConflict: "id" });
        } catch (e) {
          console.warn("Profile upsert warning:", e);
        }

        statusEl.textContent = "You're in! Mission briefings will arrive by email. 🚀";
        // Optional: redirect home in a few seconds
        setTimeout(() => location.href = "../index.html", 2500);

      } catch (e) {
        console.error(e);
        statusEl.textContent = "Something went wrong. Please try the link again.";
      }
    })();
  </script>
</body>
</html>

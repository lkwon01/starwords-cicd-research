<!doctype html>
<meta charset="utf-8">
<title>Join the Rebellion — Star Words</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<body style="margin:0;background:#000;color:#feda4a;font-family:Arial,sans-serif">
  <main style="max-width:760px;margin:40px auto;padding:24px">
    <h1>Join the Rebellion</h1>
    <p>Enter your email to receive a sign-in link. After you confirm, you’re in.</p>

    <form id="joinForm" style="margin-top:16px">
      <input id="email" name="email" type="email" placeholder="Email" required
             style="padding:10px;border-radius:6px;border:none;margin-right:8px;width:min(320px,70%)">
      <button id="joinBtn" type="submit"
              style="padding:10px 16px;border-radius:6px;border:none;background:#feda4a;color:#000;cursor:pointer">
        Send Magic Link
      </button>
    </form>

    <p id="msg" style="margin-top:12px;color:#ccc"></p>

    <p style="margin-top:24px"><a href="../index.html" style="color:#feda4a">← Back</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // TODO: fill in your project values
    const SUPABASE_URL = "https://zvhjoupdxkzbbqanbrby.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2aGpvdXBkeGt6YmJxYW5icmJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ3NjYyNjcsImV4cCI6MjA3MDM0MjI2N30.ZCWqACzlCqgbVb1R7goLnmfsdws50wsGYQrnWrYW998";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('joinForm');
    const emailEl = document.getElementById('email');
    const btn = document.getElementById('joinBtn');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = (emailEl.value || '').trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msg.textContent = "Please enter a valid email."; return;
      }
      btn.disabled = true; msg.textContent = "Sending magic link...";
      try {
        const { error } = await client.auth.signInWithOtp({
          email,
          options: {
            emailRedirectTo: `${location.origin}/join/confirm.html`
          }
        });
        if (error) throw error;
        msg.textContent = "Check your inbox for the magic link ✉️";
        form.reset();
      } catch (err) {
        console.error(err);
        msg.textContent = "Could not send email. Try again.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
